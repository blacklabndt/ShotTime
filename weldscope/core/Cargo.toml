[package]
name = "weldscope-core"
version.workspace = true
edition.workspace = true
description = "WeldScope DICONDE core: DICOM reading/writing, INDUSTREX compatibility, image processing"

[dependencies]
openjpeg-sys = "1.0"
flate2 = "1"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jpeg-encoder = "0.6"
png = "0.17"
regex = "1"

[dev-dependencies]
serde_json = "1"
