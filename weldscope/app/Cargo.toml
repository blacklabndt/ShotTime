[package]
name = "weldscope"
version.workspace = true
edition.workspace = true
description = "WeldScope - DICONDE image editor"

[dependencies]
weldscope-core = { path = "../core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu", "persistence"] }
rfd = "0.15"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
epaint_default_fonts = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "WeldScope"
path = "src/main.rs"
